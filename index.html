<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>BUNSKI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('band.jpg') no-repeat center center/cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .overlay {
      background: rgba(0,0,0,0.4);
      padding: 30px;
      border-radius: 10px;
      text-align: center;
    }

    a {
      display: block;
      margin: 10px 0;
      color: white;
      text-decoration: none;
      font-size: 18px;
      border: 1px solid white;
      padding: 10px;
      transition: 0.3s;
    }

    a:hover {
      background: white;
      color: black;
    }
  </style>
</head>

<body>
  <div class="overlay">
    <h1>BUNSKI</h1>

    <a href="https://spotify.com" target="_blank">Spotify</a>
    <a href="https://instagram.com" target="https://www.instagram.com/bunski_music/">Instagram</a>
    <a href="https://youtube.com" target="_blank">YouTube</a>
  </div>
</body>
</html>
